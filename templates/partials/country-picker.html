{# Country picker: `picker_id` makes the ids unique, `current` is the chosen code, `codes` the offered ones. static/js/country-picker.js wires it. #}
<details class="filter-pop country-picker" data-country-picker data-current="{{ current }}" id="{{ picker_id }}-country-pop"><summary class="country-button" aria-label="Country: {{ current }}. Change country"><img class="country-flag" src="{{ url_for('static', filename='flags/' ~ current|lower ~ '.svg') }}" alt="" width="20" height="15"><span class="country-code">{{ current }}</span></summary><div class="filter-menu country-menu"><label class="visually-hidden" for="{{ picker_id }}-country-search">Search countries</label><input class="form-control form-control-sm country-search" id="{{ picker_id }}-country-search" type="search" placeholder="Country or code" autocomplete="off" spellcheck="false"><div class="country-list">{% for code in codes %}<button class="menu-item country-option" type="button" data-code="{{ code }}" aria-pressed="{{ 'true' if code == current else 'false' }}"><img class="country-flag" src="{{ url_for('static', filename='flags/' ~ code|lower ~ '.svg') }}" alt="" width="20" height="15" loading="lazy"><span class="country-code">{{ code }}</span><span class="country-name"></span></button>{% endfor %}</div><p class="hint country-none" hidden>No country matches.</p></div></details>
