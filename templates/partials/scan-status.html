<details class="sync" id="sync">
  <summary class="sync-toggle" id="sync-toggle" data-state="running"><span class="sync-dot" aria-hidden="true"></span><span id="sync-label">Scanning…</span></summary>
  <div class="sync-panel">
<div class="progress-wrap" id="loading-panel">
          <p class="feedback" id="status-message" role="status">Preparing your watchlist...</p>
          <div class="scan-progress">
          <div class="scan-phase-line"><span id="scan-phase">Preparing</span><span id="scan-live-stats">0 checked · 0 available · 0 unavailable · 0 failed</span></div>
          <div class="progress progress-track" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="progress-label"><span id="current-title">Starting scan</span><span id="progress-count">0%</span></div>
          </div>
          <div class="toolbar"><button class="btn btn-sm btn-outline-secondary" id="cancel-scan" type="button"><i class="ti ti-stop-circle" aria-hidden="true"></i> Cancel scan</button><button class="btn btn-sm btn-accent" id="retry-scan" type="button" hidden><i class="ti ti-arrow-clockwise" aria-hidden="true"></i> Scan now</button><label id="grey-unavailable-label" hidden><input id="grey-unavailable" type="checkbox"> Hide films this scan finds unavailable</label></div>
        </div>
        <details class="scan-failures" id="scan-failures" hidden><summary><i class="ti ti-alert-triangle" aria-hidden="true"></i> Failed lookups <span class="badge text-bg-danger" id="failed-count">0</span></summary><ul id="failed-list"></ul></details>
        <p class="error" id="error-message" role="alert" hidden></p>
        <div class="upload-label"><span>Scan a Letterboxd CSV export instead</span><div class="file-pick"><input class="file-input" id="csv-upload" type="file" accept=".csv,text/csv"><label class="btn btn-sm btn-outline-secondary" for="csv-upload">Choose CSV…</label><span class="file-name" id="csv-name">No file chosen</span></div></div>
  </div>
</details>
<div class="scan-line" id="scan-line" hidden><span></span></div>
