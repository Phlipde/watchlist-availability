<div class="toolbar" id="result-tools" hidden><select class="form-select form-select-sm w-auto" id="favorite-status-filter" aria-label="Favorite status" hidden><option value="all">All favorite statuses</option><option value="plan">Plan</option><option value="watching">Watching</option><option value="watched">Watched</option></select><button class="btn btn-sm btn-outline-secondary" id="view-mode" type="button" aria-pressed="false" title="Show posters only"><i class="ti ti-layout-grid" aria-hidden="true"></i> Compact</button><div class="segmented view-switch" role="radiogroup" aria-label="View" id="view-switch">{% for value, label, icon in [('grid', 'Grid', 'ti-layout-grid'), ('compact', 'Compact', 'ti-layout-grid-add'), ('table', 'Table', 'ti-table')] %}<label title="{{ label }}"><input type="radio" name="view-mode" value="{{ value }}"{% if value == 'grid' %} checked{% endif %}><i class="ti {{ icon }}" aria-hidden="true"></i><span class="visually-hidden">{{ label }}</span></label>{% endfor %}</div><button class="btn btn-sm btn-outline-secondary" id="favorites-view" type="button" aria-pressed="false"><i class="ti ti-star-fill" aria-hidden="true"></i> My favorites</button><details class="export-menu"><summary class="btn btn-sm btn-outline-secondary"><i class="ti ti-dots" aria-hidden="true"></i> More</summary><div class="export-menu-items"><button class="btn btn-sm btn-outline-secondary" id="share-button" type="button"><i class="ti ti-link" aria-hidden="true"></i> Share link</button><button class="btn btn-sm btn-outline-secondary" id="export-favorites" type="button"><i class="ti ti-star" aria-hidden="true"></i> Favorites CSV</button><button class="btn btn-sm btn-outline-secondary" id="export-favorites-json" type="button"><i class="ti ti-file-type-json" aria-hidden="true"></i> Favorites JSON</button><label class="btn btn-sm btn-outline-secondary mb-0" for="import-favorites"><i class="ti ti-upload" aria-hidden="true"></i> Import favorites<input class="visually-hidden" id="import-favorites" type="file" accept=".json,.csv,application/json,text/csv"></label><button class="btn btn-sm btn-outline-secondary" id="export-json" type="button"><i class="ti ti-download" aria-hidden="true"></i> Films JSON</button><button class="btn btn-sm btn-outline-secondary" id="export-csv" type="button"><i class="ti ti-filetype-csv" aria-hidden="true"></i> Films CSV</button></div></details></div>
