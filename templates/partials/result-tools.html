<div class="toolbar" id="result-tools" hidden><select class="form-select form-select-sm w-auto" id="favorite-status-filter" aria-label="Favorite status" hidden><option value="all">All favorite statuses</option><option value="plan">Plan</option><option value="watching">Watching</option><option value="watched">Hidden away</option></select><div class="segmented view-switch" role="radiogroup" aria-label="View" id="view-switch">{% for value, label, icon in [('grid', 'Grid', 'ti-layout-grid'), ('compact', 'Compact', 'ti-layout-grid-add'), ('table', 'Table', 'ti-table')] %}<label title="{{ label }}"><input type="radio" name="view-mode" value="{{ value }}"{% if value == 'grid' %} checked{% endif %}><i class="ti {{ icon }}" aria-hidden="true"></i><span class="visually-hidden">{{ label }}</span></label>{% endfor %}</div><button class="btn btn-ghost btn-icon" id="favorites-view" type="button" aria-pressed="false" title="Only favorites" aria-label="Only favorites"><i class="ti ti-heart" aria-hidden="true"></i></button><button class="btn btn-ghost btn-icon" id="share-button" type="button" title="Copy link to this view" aria-label="Copy link to this view"><i class="ti ti-link" aria-hidden="true"></i></button></div>
