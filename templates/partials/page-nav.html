<nav class="page-nav" aria-label="Pages">{% for href, label, icon in [('/', 'Watchlist', 'ti-movie'), ('/subscriptions', 'Subscriptions', 'ti-credit-card'), ('/stats', 'Stats', 'ti-chart-bar'), ('/settings', 'Settings', 'ti-settings')] %}<a href="{{ href }}" data-text="{{ label }}"{% if request.path == href or (href != '/' and request.path.startswith(href + '/')) %} aria-current="page"{% endif %}><i class="ti {{ icon }}" aria-hidden="true"></i><span>{{ label }}</span></a>{% endfor %}</nav>
