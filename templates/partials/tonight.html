<section class="tonight-page" id="tonight-page" aria-label="Tonight">
          <div class="deadline-banner" id="deadline-banner" role="status" hidden></div>
          <div class="context-line"><p id="context-text"></p><button class="btn btn-sm btn-accent" id="pick-for-me" type="button" title="Shortcut: r"><i class="ti ti-dice-5" aria-hidden="true"></i> Pick for me</button></div>
          <div class="saved-views" id="tonight-views" role="group" aria-label="Saved views" hidden></div>
          <div class="tonight-chips" role="group" aria-label="Quick filters">{% for id, label in [('tonight', 'Under 2 h'), ('short', 'Under 100 min'), ('rated', 'Highly rated'), ('free', 'Free only')] %}<button class="quick-chip" type="button" data-chip="{{ id }}" aria-pressed="false">{{ label }}</button>{% endfor %}</div>
          <div id="tonight-rows" tabindex="-1" aria-label="Films for tonight"><div class="skeleton-grid" role="status" aria-label="Loading films"><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div></div></div>
          <details class="recently-removed" id="tonight-gone" hidden><summary>Recently gone from your services <span class="pill pill-gone" id="tonight-gone-count">0</span></summary><ul class="change-list" id="tonight-gone-list"></ul></details>
        </section>
