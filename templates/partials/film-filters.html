<div class="film-filters" id="film-filters" role="group" hidden aria-label="Film filters">
          <input class="form-control form-control-sm" id="film-search" type="search" placeholder="Search films..." aria-label="Search films" value="{{ initial_filters.query }}">
          <select class="form-select form-select-sm" id="availability-filter" aria-label="Availability"><option value="available">Available only</option><option value="all">Everything (incl. unavailable)</option><option value="Free">Free &amp; with ads</option><option value="Paid">Paid</option><option value="unavailable">Unavailable only</option></select>
          <select class="form-select form-select-sm" id="genre-filter" aria-label="Genre"><option value="all">All genres</option></select>
          <select class="form-select form-select-sm" id="runtime-filter" aria-label="Runtime"><option value="all">Any runtime</option><option value="short">Under 90 min</option><option value="medium">90-120 min</option><option value="long">Over 120 min</option></select>
          <select class="form-select form-select-sm" id="min-rating" aria-label="Minimum TMDB rating"><option value="0">Any TMDB rating</option><option value="6">TMDB 6+</option><option value="7">TMDB 7+</option><option value="8">TMDB 8+</option><option value="9">TMDB 9+</option></select>
          <details class="more-filters" id="more-filters">
            <summary>More filters <span id="more-filters-count"></span></summary>
            <div class="more-filters-grid">
              <select class="form-select form-select-sm" id="kind-filter" aria-label="Offer type"><option value="all">Any offer type</option><option value="free">Free</option><option value="ads">With ads</option><option value="flatrate">Subscription</option><option value="rent">Rent</option></select>
              <label class="year-field">From <input class="form-control form-control-sm" id="year-from" type="number" placeholder="Year" aria-label="Year from"></label>
              <label class="year-field">To <input class="form-control form-control-sm" id="year-to" type="number" placeholder="Year" aria-label="Year to"></label>
              <select class="form-select form-select-sm" id="min-votes" aria-label="Minimum TMDB votes"><option value="0">Any vote count</option><option value="100">100+ votes</option><option value="1000">1,000+ votes</option><option value="10000">10,000+ votes</option></select>
              <select class="form-select form-select-sm" id="keyword-filter" aria-label="Keyword"><option value="all">All keywords</option></select>
              <select class="form-select form-select-sm" id="age-filter" aria-label="Age rating"><option value="all">Any age rating</option></select>
              <select class="form-select form-select-sm" id="media-filter" aria-label="Media"><option value="all">Any media</option><option value="trailer">With trailer</option></select>
              <select class="form-select form-select-sm" id="change-filter" aria-label="Availability changes"><option value="all">Any change</option><option value="added">Newly available</option><option value="removed">No longer available</option></select>
              <select class="form-select form-select-sm" id="provider-count-filter" aria-label="Minimum number of services"><option value="0">Any number of services</option><option value="2">On 2+ services</option><option value="3">On 3+ services</option><option value="4">On 4+ services</option></select>
              <label class="check-field"><input id="exclusive-filter" type="checkbox"> Only on one of my services</label>
            </div>
          </details>
        </div>
