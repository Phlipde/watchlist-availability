[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", ".claude", ".agents", ".claude-flow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Compatibility facade: re-exports names for old imports and tests.
"watchlist_availability.py" = ["F401"]
# Long inline HTML/CSS strings.
"watchlist_app/rendering.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests need Playwright and a browser; run them with `pytest -m browser`.
addopts = "-m 'not browser'"
markers = [
    "browser: end-to-end tests in a real browser (Playwright)",
    "provider_catalog: uses the real TMDB provider list function (mocked HTTP)",
    "regions_request: uses the real TMDB country list function (mocked HTTP)",
    "letterboxd_rating:uses the real Letterboxd rating function (mocked HTTP)",
]

[tool.mypy]
python_version = "3.12"
files = ["watchlist_app", "web", "app.py", "watchlist_availability.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
